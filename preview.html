<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Simple</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    .products {
      flex: 3;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .product button {
      margin-top: 10px;
      padding: 8px;
      border: none;
      background: #28a745;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    .cart {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 10px;
      height: fit-content;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .cart h2 {
      margin-top: 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>🛍️ Mi Tienda</h1>
</header>

<div class="container">
  
  <div class="products" id="products"></div>

  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-items"></div>
    <div class="total">Total: $<span id="total">0</span></div>
  </div>

</div>

<script>
  const products = [
    { id: 1, name: "Camiseta", price: 20 },
    { id: 2, name: "Zapatos", price: 50 },
    { id: 3, name: "Gorra", price: 15 },
    { id: 4, name: "Mochila", price: 35 }
  ];

  const cart = [];

  const productsContainer = document.getElementById("products");
  const cartContainer = document.getElementById("cart-items");
  const totalElement = document.getElementById("total");

  function renderProducts() {
    productsContainer.innerHTML = "";
    products.forEach(product => {
      productsContainer.innerHTML += `
        <div class="product">
          <h3>${product.name}</h3>
          <p>$${product.price}</p>
          <button onclick="addToCart(${product.id})">Agregar</button>
        </div>
      `;
    });
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    cart.push(product);
    renderCart();
  }

  function renderCart() {
    cartContainer.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
      total += item.price;
      cartContainer.innerHTML += `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>$${item.price}</span>
        </div>
      `;
    });

    totalElement.textContent = total;
  }

  renderProducts();
</script>

</body>
</html>
